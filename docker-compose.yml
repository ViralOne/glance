services:
  glance:
    build:
      context: ./server
    image: ghcr.io/ViralOne/glance:latest
    restart: unless-stopped
    ports:
      - "8082:8080"
    volumes:
      # The container runs as uid 1000. On Linux hosts run `mkdir -p data && chown 1000:1000 data` once.
      - "./data:/data"
    env_file:
      - path: .env
        required: false
    environment:
      GLANCE_DATABASE_PATH: /data/glance.db
      # This file publishes the port directly, so there is no proxy to trust and
      # X-Forwarded-For is whatever the caller sent. Put Glance behind a reverse
      # proxy for real use and set GLANCE_TRUSTED_PROXY_HOPS to the number of
      # proxies in front of it (usually 1) so visitors are counted per address
      # rather than all as one.
      GLANCE_TRUSTED_PROXY_HOPS: "0"
